- THE POSITION-CONSERVED / SEQUENCE-DIVERGED CONTROL, argued from HMM detection rather than percent identity.
  The Pfam family PF10624 ('Plasmid conjugative transfer entry exclusion protein TraS'), built on the
  IncFII type, scores R100 traS at 312.5 at the GA threshold and DOES NOT DETECT F traS at all. A purpose-built
  family for this exact gene cannot cross from IncFII to IncFI. Yet both sit in the same operon slot immediately
  downstream of traG. That is a threshold-anchored, reproducible statement and it is the cleanest single
  argument for the position-first strategy.
- 'DO NOT use the F/R100 TraS percent identity for this argument. The alignment is marginal -- 74 of 203
  columns gapped (36%) -- and the value is unstable to method: 17.7% (BLOSUM62 -11/-1, id/alignment length),
  27.9% (same alignment, id/ungapped columns), 25.5% (BLOSUM45), 40.0% (local, over a 15-residue block).
  Both original figures were correct arithmetic under different denominators (see scripts/lib/metrics.py,
  A6), but no single number here is a stable claim'
- PGAP re-annotation of NC_002134.1 DROPPED the /gene="traS" qualifier that AP000342.1 carries -- the
